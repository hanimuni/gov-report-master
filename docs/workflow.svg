  <text x="548" y="240" font-size="10.0" fill="#eb6c36" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-weight="500" letter-spacing="0.12em">04</text>
  <text x="548" y="268" font-size="15.0" fill="#2d3142" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="600">뼈대 승인</text>
  <text x="548" y="292" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">목차·쪽수·밀도</text>
  <text x="548" y="308" font-size="12.0" fill="#eb6c36" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">사람이 승인</text>
  <rect x="700" y="216" width="136" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="716" y="240" font-size="10.0" fill="#7a8399" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-weight="500" letter-spacing="0.12em">05</text>
  <text x="716" y="268" font-size="15.0" fill="#2d3142" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="600">본문 작성</text>
  <text x="716" y="292" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">두괄식 · 개조식</text>
  <text x="716" y="308" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">위계 6단</text>
  <rect x="868" y="216" width="136" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="884" y="240" font-size="10.0" fill="#7a8399" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-weight="500" letter-spacing="0.12em">06</text>
  <text x="884" y="268" font-size="15.0" fill="#2d3142" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="600">검수·평가</text>
  <text x="884" y="292" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">게이트 스크립트</text>
  <text x="884" y="308" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">감사 에이전트</text>
  <rect x="1036" y="216" width="136" height="104" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="1052" y="240" font-size="10.0" fill="#7a8399" font-family="'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace" font-weight="500" letter-spacing="0.12em">07</text>
  <text x="1052" y="268" font-size="15.0" fill="#2d3142" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="600">한글 파일</text>
  <text x="1052" y="292" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">HWPX 생성</text>
  <text x="1052" y="308" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">편집 표준 검사</text>
  <text x="28" y="388" font-size="12.5" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">검수에서 결함이 나오면 전체를 다시 쓰지 않고, 원인이 된 단계로만 되돌아갑니다.</text>
  <line x1="28" y1="412" x2="1172" y2="412" stroke="rgba(45,49,66,0.12)" stroke-width="1"/>
  <text x="28" y="444" font-size="13.5" fill="#2d3142" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="600">작성 4단계</text>
  <text x="28" y="464" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">기획 → 쓰기 → 편집 → 전달</text>
  <text x="412" y="444" font-size="13.5" fill="#2d3142" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="600">본문 위계</text>
  <text x="412" y="464" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">Ⅰ → 1 → □ → ○ → - → ·  (필요한 만큼만)</text>
  <text x="796" y="444" font-size="13.5" fill="#2d3142" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif" font-weight="600">편집 표준</text>
  <text x="796" y="464" font-size="12.0" fill="#4f5d75" font-family="'Pretendard','Apple SD Gothic Neo','Malgun Gothic','Segoe UI',system-ui,sans-serif">함초롬바탕 15p · 줄간격 160% · 여백 20mm</text>
</svg>
